<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>網球對決</title>
<style>
  :root { --accent:#e9ff4f; --panel:rgba(10,20,30,.88); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#16301f; font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; color:#fff; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.45); padding:16px; z-index:10; }
  .hidden { display:none !important; }
  .card { background:var(--panel); border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:22px 20px; width:100%; max-width:420px; max-height:100%; overflow:auto; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.5); touch-action:pan-y; }
  h1 { margin:0 0 4px; font-size:32px; letter-spacing:2px; }
  h1 span { color:var(--accent); }
  .sub { opacity:.7; margin:0 0 14px; font-size:14px; }
  .label { font-size:13px; opacity:.75; margin:14px 0 6px; text-align:left; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; }
  button { font:inherit; font-size:15px; padding:10px 8px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; cursor:pointer; }
  button.on { background:var(--accent); color:#1b2a10; border-color:var(--accent); font-weight:700; }
  button.go { width:100%; margin-top:16px; padding:13px; font-size:17px; font-weight:700; background:var(--accent); color:#1b2a10; border:none; }
  button.ghost { width:100%; margin-top:10px; }
  button.net { background:rgba(120,190,255,.22); border-color:rgba(120,190,255,.5); font-weight:600; }
  input { font:inherit; font-size:16px; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(0,0,0,.3); color:#fff; flex:1.4; min-width:0; text-transform:uppercase; letter-spacing:3px; text-align:center; user-select:text; -webkit-user-select:text; }
  .hr { height:1px; background:rgba(255,255,255,.12); margin:18px 0 4px; }
  .help { margin-top:16px; font-size:13px; line-height:1.7; opacity:.8; text-align:left; background:rgba(255,255,255,.05); padding:10px 12px; border-radius:10px; }
  kbd { background:rgba(255,255,255,.15); border-radius:4px; padding:0 5px; font-family:inherit; font-size:12px; }
  .big { font-size:28px; margin:0 0 8px; font-weight:700; }
  .code { font-size:44px; font-weight:800; letter-spacing:8px; color:var(--accent); margin:6px 0 10px; }
  #finalScore { font-size:18px; opacity:.85; margin-bottom:6px; }
  #touch { position:fixed; inset:auto 0 0 0; height:150px; z-index:5; pointer-events:none; }
  #joy { position:absolute; left:18px; bottom:18px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.25); pointer-events:auto; }
  #knob { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.45); }
  .tbtn { position:absolute; bottom:24px; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-weight:700; border:2px solid rgba(255,255,255,.35); color:#fff; }
  #bShot { right:18px; width:96px; height:96px; background:rgba(233,255,79,.35); font-size:18px; }
  #bLob { right:126px; bottom:30px; width:66px; height:66px; background:rgba(120,190,255,.3); font-size:15px; }
  #pauseBtn { position:fixed; top:10px; right:10px; z-index:6; padding:6px 12px; font-size:14px; }
  #netTag { position:fixed; top:12px; right:12px; z-index:6; font-size:12px; padding:5px 10px; border-radius:999px; background:rgba(8,16,24,.8); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" class="hidden">⏸ 暫停</button>
<div id="netTag" class="hidden"></div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>🎾 網球<span>對決</span></h1>
    <p class="sub">單打比賽 · 對戰電腦或和朋友連線</p>
    <div class="label">賽制</div>
    <div class="seg" id="lenSeg">
      <button data-v="3" class="on">快速賽（搶 3 局）</button>
      <button data-v="6">標準一盤（6 局）</button>
    </div>
    <div class="label">電腦難度</div>
    <div class="seg" id="diffSeg">
      <button data-v="easy">簡單</button>
      <button data-v="normal" class="on">普通</button>
      <button data-v="hard">困難</button>
    </div>
    <button class="go" id="startBtn">對戰電腦</button>
    <div class="hr"></div>
    <div class="label">🌐 和朋友連線對戰</div>
    <div class="seg"><button class="net" id="hostBtn">建立房間</button></div>
    <div class="seg" style="margin-top:8px"><input id="codeIn" placeholder="房間代碼" maxlength="6" autocomplete="off"><button class="net" id="joinBtn">加入房間</button></div>
    <div class="help" id="helpKeys">
      <kbd>←↑→↓</kbd> / <kbd>WASD</kbd> 移動<br>
      <kbd>空白鍵</kbd> / <kbd>J</kbd> 擊球、發球（按一下拋球，球在最高點時再按一下）<br>
      <kbd>F</kbd> 高吊球 · <kbd>P</kbd> 暫停（單機）<br>
      擊球瞬間按住 <kbd>←</kbd>/<kbd>→</kbd> 控制落點、按住 <kbd>↑</kbd> 加大力道；提早按會引拍等球，時機越準球越快越穩。<br>
      高吊球會在地上標出落點圈，圈縮到最小時球就落地。
    </div>
  </div>
</div>

<div id="lobby" class="overlay hidden">
  <div class="card">
    <p class="big" id="lobbyTitle">連線對戰</p>
    <div class="code hidden" id="lobbyCode"></div>
    <p class="sub" id="lobbyMsg"></p>
    <button class="go hidden" id="copyBtn">複製邀請連結</button>
    <button class="ghost" id="lobbyCancel">取消</button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <p class="big" id="result">你贏了！</p>
    <div id="finalScore"></div>
    <button class="go" id="againBtn">再來一場</button>
    <button class="ghost" id="menuBtn">回主選單</button>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <p class="big">暫停中</p>
    <button class="go" id="resumeBtn">繼續</button>
    <button class="ghost" id="quitBtn">回主選單</button>
  </div>
</div>

<div id="touch" class="hidden">
  <div id="joy"><div id="knob"></div></div>
  <div class="tbtn" id="bLob">高吊</div>
  <div class="tbtn" id="bShot">擊球</div>
</div>

<script>
'use strict';
// ====== 常數（公尺 / 秒）======
const HW = 4.115, HL = 11.885, SL = 6.40, DHW = 5.485, NET = 0.914, POST = 5.03;
const G = 9.8, TS = 0.82, BR = 0.06;
const CAMY = 31, CAMH = 13;
const PEER_PREFIX = 'tennis-duel-room-';
const DIFFS = {
  easy:   { move: 4.6, react: 0.32, err: 0.20, spd: 16, sq: [0.45, 0.9] },
  normal: { move: 5.8, react: 0.20, err: 0.11, spd: 19, sq: [0.55, 1.0] },
  hard:   { move: 7.0, react: 0.10, err: 0.05, spd: 22, sq: [0.70, 1.0] },
};
let NAMES = { P: '你', A: '電腦' };
const opp = w => (w === 'P' ? 'A' : 'P');
const sideOf = w => (w === 'P' ? 1 : -1);
const rand = (a, b) => a + Math.random() * (b - a);
const randn = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.4;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = s => String(s).replace(/\{([PA])\}/g, (_, w) => NAMES[w]);

// ====== 連線狀態 ======
let net = null;            // { role:'host'|'guest', peer, conn, code }
const isHost = () => !!(net && net.role === 'host' && net.conn);
const isGuest = () => !!(net && net.role === 'guest');
const me = () => (isGuest() ? 'A' : 'P');
let events = [];           // 主機要送給客人的事件
let remoteIn = { dx: 0, dy: 0 };
let FLIP = false;          // 客人視角翻轉，讓自己在畫面下方

// ====== 畫布 / 投影 ======
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
let W, H, F, HZ, CX;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const Dn = CAMY - 14.6, Df = CAMY + 14.6;
  const top = 56 + H * 0.1, bot = isTouch ? 160 : 44;
  const avail = H - top - bot;
  const fH = avail / (CAMH / Dn - (CAMH - 2.1) / Df);
  const fW = W * 0.98 / (2 * 6.6 / Dn);
  F = Math.min(fH, fW); CX = W / 2;
  const used = F * (CAMH / Dn - (CAMH - 2.1) / Df);
  HZ = top + (avail - used) / 2 - F * (CAMH - 2.1) / Df;
}
addEventListener('resize', resize); resize();
function P3v(x, y, z) { const s = F / Math.max(1, CAMY - y); return [CX + x * s, HZ + (CAMH - z) * s, s]; }
function P3(x, y, z) { return FLIP ? P3v(-x, -y, z) : P3v(x, y, z); }

// ====== 音效 ======
let AC = null;
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function snd(f, d, type, vol) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.5, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
const SOUNDS = {
  hit: () => snd(620, 0.09, 'square', 0.12),
  bounce: () => snd(170, 0.07, 'sine', 0.25),
  net: () => snd(110, 0.12, 'sawtooth', 0.12),
  point: () => { cheer = 1.8; applause(); snd(660, 0.15, 'triangle', 0.15); setTimeout(() => snd(880, 0.2, 'triangle', 0.15), 120); },
};
let cheer = 0, noiseBuf = null;
function applause() {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.03 ? 1 : 0.18);
  }
  const t = AC.currentTime, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 0.5;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
  src.connect(f).connect(g).connect(AC.destination); src.start(t); src.stop(t + 2);
}
function play(n) { SOUNDS[n](); if (isHost()) events.push({ k: 's', n }); }

// ====== 遊戲狀態 ======
let mode = 'menu', paused = false;
let diffKey = 'normal', target = 3, D = DIFFS.normal;
let phase = 'dead', deadTimer = 0;
let serveTry = 1, curServer = 'P', boxSign = -1, aiServeTimer = 0;
let sc = null, matchOver = null;
let msg = { main: '', sub: '', t: 0 }, pops = [];
const P = { x: 0, y: 12.5, swing: 0, run: 0, wp: 0, joy: 0, sType: 'drive', hitDone: true, hold: 0, bh: false, color: '#e8443a' };
const A = { x: 0, y: -12.5, swing: 0, run: 0, wp: 0, joy: 0, sType: 'drive', hitDone: true, hold: 0, bh: false, color: '#ffd23f', plan: null, react: 0 };
const obj = w => (w === 'P' ? P : A);
const ball = { x: 0, y: 0, z: 1, vx: 0, vy: 0, vz: 0, held: true, tossed: false, lastHitter: null, bounces: 0, isServe: false, netHit: false, trail: [], mark: null };

function newMatch() {
  D = DIFFS[diffKey];
  sc = { pts: { P: 0, A: 0 }, games: { P: 0, A: 0 }, tb: false, tbFirst: 'P', gameServer: 'P' };
  matchOver = null; serveTry = 1;
  mode = 'play'; paused = false;
  setupServe();
  showMsg('比賽開始！', '{P}先發球');
}

function server() {
  if (!sc.tb) return sc.gameServer;
  const n = sc.pts.P + sc.pts.A;
  return ((n + 1) >> 1) % 2 === 0 ? sc.tbFirst : opp(sc.tbFirst);
}
function deuceCourt() { return (sc.pts.P + sc.pts.A) % 2 === 0; }

function setupServe() {
  curServer = server();
  const s = sideOf(curServer), r = -s;
  const sx = s * (deuceCourt() ? 1 : -1) * 0.9;
  boxSign = -Math.sign(sx);
  const srv = obj(curServer), rcv = obj(opp(curServer));
  srv.x = sx; srv.y = s * 12.3;
  rcv.x = boxSign * 2.4; rcv.y = r * 12.6;
  P.swing = 0; A.swing = 0; A.plan = null;
  Object.assign(ball, { held: true, tossed: false, vx: 0, vy: 0, vz: 0, lastHitter: null, bounces: 0, isServe: false, netHit: false, trail: [], mark: null });
  holdBall();
  phase = 'serve';
  aiServeTimer = rand(0.8, 1.3);
}
function holdBall() {
  const srv = obj(curServer), s = sideOf(curServer);
  ball.x = srv.x + 0.3 * s; ball.y = srv.y - 0.2 * s; ball.z = 1.0;
}
function toss() { ball.held = false; ball.tossed = true; ball.vx = ball.vy = 0; ball.vz = 5.2; }

// 以飛行時間 T 打到 (tx,ty)，自動確保過網
function launch(tx, ty, T, netErr, minClear) {
  const b = ball;
  let vx, vy, vz;
  for (let i = 0; i < 80; i++) {
    vx = (tx - b.x) / T; vy = (ty - b.y) / T; vz = (-b.z + 0.5 * G * T * T) / T;
    const tn = -b.y / vy;
    if (!(tn > 0 && tn < T)) break;
    if (b.z + vz * tn - 0.5 * G * tn * tn >= NET + minClear) break;
    T += 0.03;
  }
  if (netErr) { const tn = -b.y / vy; if (tn > 0) vz = (0.45 - b.z + 0.5 * G * tn * tn) / tn; }
  b.vx = vx; b.vy = vy; b.vz = vz;
  b.held = false; b.tossed = false; b.bounces = 0; b.netHit = false;
  // 高吊球：算出落點，畫地面標記方便判斷距離
  const apex = b.z + Math.max(0, vz) ** 2 / (2 * G);
  if (apex > 2.8 && !netErr) {
    const tl = (vz + Math.sqrt(vz * vz + 2 * G * b.z)) / G;
    b.mark = [b.x + vx * tl, b.y + vy * tl, b.x, b.y];
  } else b.mark = null;
  play('hit');
}

// aim：發球者自己視角的左右（-1/0/1）
function serveShot(who, q, aim) {
  const s = sideOf(who), r = -s, second = serveTry === 2;
  let tx = boxSign * 2.0 + aim * 1.45 * s, ty = r * (second ? 4.7 : 5.2);
  const spread = (1 - q) * (second ? 0.9 : 1.9);
  tx += randn() * spread; ty += randn() * spread * 0.8;
  const spd = second ? 16 : 21 + 7 * q;
  const netErr = Math.random() < (second ? 0.04 : (1 - q) * 0.3);
  launch(tx, ty, Math.hypot(tx - ball.x, ty - ball.y) / spd, netErr, 0.08);
  ball.isServe = true; ball.lastHitter = who; phase = 'rally';
  const p = obj(who); p.swing = 0.0001; p.hitDone = true; p.sType = 'serve';
  A.plan = null; A.react = D.react;
  if (q > 0.85) pop('完美發球！', who);
}

// ====== 輸入 ======
const keys = {};
const joy = { x: 0, y: 0 };
function localInput() {
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (Math.abs(joy.x) > 0.15 || Math.abs(joy.y) > 0.15) { dx = joy.x; dy = joy.y; }
  return { dx, dy };
}
const inputOf = who => (who === 'A' ? remoteIn : localInput());
const aimOf = inp => (inp.dx > 0.35 ? 1 : inp.dx < -0.35 ? -1 : 0);

function pressShot(who, type) {
  if (mode !== 'play' || paused) return;
  if (phase === 'serve' && curServer === who) {
    if (!ball.tossed) toss();
    else if (ball.z > 1.4) serveShot(who, 1 - Math.min(1, Math.abs(ball.vz) / 4.5), aimOf(inputOf(who)));
    return;
  }
  const p = obj(who);
  if (p.swing === 0 || p.swing > 0.85) { p.swing = 0.0001; p.sType = type; p.hitDone = false; p.hold = 0; p.bh = isBackhand(who); }
}
// 球拍那一側（世界座標 x）：兩人都是右手持拍
const racketSide = who => (who === 'P' ? 1 : -1);
// 預測球到達擊球點時的 x
function contactX(who) {
  const p = obj(who), s = sideOf(who), b = ball;
  if (b.vy * s <= 0.5) return b.x;
  const t = ((p.y - 0.4 * s) - b.y) / b.vy;
  return t > 0 ? b.x + b.vx * t : b.x;
}
const isBackhand = who => (contactX(who) - obj(who).x) * racketSide(who) < -0.15;
function localShot(type) {
  initAudio();
  if (isGuest()) { if (net.conn && net.conn.open) net.conn.send({ t: 'shot', type }); return; }
  pressShot('P', type);
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.code === 'Enter') $('joinBtn').click(); return; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'KeyJ') localShot('drive');
  if (e.code === 'KeyF' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') localShot('lob');
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// 觸控
const touchEl = document.getElementById('touch'), joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
let joyId = null;
function joyMove(t) {
  const r = joyEl.getBoundingClientRect();
  let dx = (t.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (t.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
  joy.x = dx; joy.y = dy;
  knob.style.transform = `translate(${dx * 35}px,${dy * 35}px)`;
}
joyEl.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); const t = e.changedTouches[0]; joyId = t.identifier; joyMove(t); }, { passive: false });
joyEl.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === joyId) joyMove(t); }, { passive: false });
const joyEnd = e => { for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
joyEl.addEventListener('touchend', joyEnd); joyEl.addEventListener('touchcancel', joyEnd);
document.getElementById('bShot').addEventListener('touchstart', e => { e.preventDefault(); localShot('drive'); }, { passive: false });
document.getElementById('bLob').addEventListener('touchstart', e => { e.preventDefault(); localShot('lob'); }, { passive: false });

// ====== 選單 ======
const $ = id => document.getElementById(id);
function seg(id, cb) {
  const el = $(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    cb(b.dataset.v);
  });
}
seg('diffSeg', v => diffKey = v);
seg('lenSeg', v => target = +v);
function hideAll() { ['menu', 'over', 'pause', 'lobby'].forEach(id => $(id).classList.add('hidden')); }
function enterGameUI() {
  hideAll();
  $('pauseBtn').classList.toggle('hidden', !!net);
  $('netTag').classList.toggle('hidden', !net);
  if (net) $('netTag').textContent = net.role === 'host' ? '🌐 連線中（主機）' : '🌐 連線中';
  if (isTouch) touchEl.classList.remove('hidden');
}
function startGame() {
  initAudio();
  if (isGuest()) { if (net.conn && net.conn.open) net.conn.send({ t: 'again' }); hideAll(); return; }
  enterGameUI();
  newMatch();
}
function toMenu() {
  leaveNet();
  mode = 'menu'; paused = false; sc = null;
  hideAll(); $('menu').classList.remove('hidden');
  $('pauseBtn').classList.add('hidden'); $('netTag').classList.add('hidden'); touchEl.classList.add('hidden');

async function hostRoom() {

// 主機收到客人的訊息
function onHostData(d) {

  else if (d.t === 'again' && mode === 'over') startGame();
}
function snapshot() {

    P: [r(P.x), r(P.y), r(P.swing), r(P.joy), P.bh ? 1 : 0, P.sType], A: [r(A.x), r(A.y), r(A.swing), r(A.joy), A.bh ? 1 : 0, A.sType],

}
// 客人收到主機的畫面狀態
function onGuestData(d) {

  if (!ball.held) { ball.trail.push([ball.x, ball.y, ball.z]); if (ball.trail.length > 8) ball.trail.shift(); } else ball.trail.length = 0;
  sc = d.sc; phase = d.ph; curServer = d.cs; serveTry = d.st; target = d.tg; matchOver = d.mo;
  for (const e of d.ev || []) {

// ====== 訊息 ======

const PT = ['0', '15', '30', '40'];
function callText() {

  const sv = sc.gameServer, rv = opp(sv), a = sc.pts[sv], b = sc.pts[rv];
  if (a >= 3 && b >= 3) return a === b ? '平分 Deuce' : `{${a > b ? sv : rv}} 佔先`;
  return a === b ? `${PT[a]} 平` : `${PT[a]} - ${PT[b]}`;

// ====== 得分 ======
function pointTo(who, why) {

  phase = 'dead'; deadTimer = 1.9; serveTry = 1;
  play('point');
  const o = opp(who);

  if (sc.pts[who] >= need && sc.pts[who] - sc.pts[o] >= 2) {

    sc.pts = { P: 0, A: 0 };
    if (sc.tb) matchOver = who;
    else if (sc.games[who] >= target && sc.games[who] - sc.games[o] >= 2) matchOver = who;

    }

    showMsg(why, gs, 1.9);

}
function fault(why) {
  if (phase === 'dead') return;
  if (serveTry === 1) {
    phase = 'dead'; deadTimer = 1.3; serveTry = 2;
    showMsg(why, '第二發球', 1.3);
  } else {
    pointTo(opp(curServer), '雙發失誤！');
  }
}

function inCourt(x, y) { return Math.abs(x) <= HW + BR && Math.abs(y) <= HL + BR; }
function inBox(x, y) { return Math.abs(y) <= SL + BR && x * boxSign >= -BR && Math.abs(x) <= HW + BR; }

function onBounce() {
  const b = ball; b.bounces++;
  const side = b.y > 0 ? 'P' : 'A', hitter = b.lastHitter, recv = opp(hitter);
  if (b.bounces === 1) {
    if (side === hitter) { b.isServe ? fault('掛網') : pointTo(recv, '沒過網！'); return; }
    if (b.isServe) { if (!inBox(b.x, b.y)) fault('發球出界！'); }
    else if (!inCourt(b.x, b.y)) pointTo(recv, '出界！');
  } else if (b.bounces === 2) {
    pointTo(hitter, b.isServe ? 'ACE！' : '致勝球！');
  }
}

// ====== 球的物理 ======
function stepBall(dt) {
  const b = ball;
  if (b.held) { holdBall(); return; }
  const oy = b.y;
  b.vz -= G * dt;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  // 場邊圍欄
  if (Math.abs(b.y) > 18) { b.y = Math.sign(b.y) * 18; b.vy *= -0.3; b.vx *= 0.5; }
  if (Math.abs(b.x) > 10) { b.x = Math.sign(b.x) * 10; b.vx *= -0.3; b.vy *= 0.5; }
  if (phase === 'serve') { if (b.z < 0.7 && b.vz < 0) { b.held = true; b.tossed = false; } return; }
  // 網子
  if (!b.netHit && (oy > 0) !== (b.y > 0) && Math.abs(b.x) < POST) {
    const nh = NET + 0.156 * (b.x / POST) ** 2;
    if (b.z < nh) {
      b.netHit = true; b.mark = null; b.y = oy > 0 ? 0.08 : -0.08; b.vy *= -0.12; b.vx *= 0.3; b.vz = Math.min(b.vz, 0);
      play('net');
      if (phase === 'rally') { b.isServe ? fault('掛網！') : pointTo(opp(b.lastHitter), '掛網！'); }
    }
  }
  // 彈地
  if (b.z <= 0 && b.vz < 0) {
    b.z = 0;
    b.mark = null;
    if (b.vz < -0.8) { b.vz = -b.vz * 0.72; b.vx *= 0.8; b.vy *= 0.8; play('bounce'); if (phase === 'rally') onBounce(); }
    else { b.vz = 0; }
  }
  if (b.z === 0 && b.vz === 0) { const f = Math.max(0, 1 - 2.5 * dt); b.vx *= f; b.vy *= f; }
}

// 預測球的路徑（給電腦用）
function predict() {
  let x = ball.x, y = ball.y, z = ball.z, vx = ball.vx, vy = ball.vy, vz = ball.vz, bn = ball.bounces;
  const dt = 1 / 120;
  for (let i = 0; i < 600; i++) {
    vz -= G * dt; x += vx * dt; y += vy * dt; z += vz * dt;
    if (z <= 0 && vz < 0) {
      z = 0; vz = -vz * 0.72; vx *= 0.8; vy *= 0.8; bn++;
      if (bn === 1 && y < 0) {
        const ok = ball.isServe ? inBox(x, y) : inCourt(x, y);
        if (!ok) return { out: true };
      }
    }
    if (y < 0 && bn >= 1 && ((z < 1.3 && vz < 0) || y < -14.5)) return { x, y, t: i * dt };
  }
  return null;
}

// ====== 擊球 ======
// force：已經等太久，球在範圍內就直接打（會偏早）
function tryHit(who, force) {
  const b = ball, p = obj(who), s = sideOf(who);
  if (phase !== 'rally' || b.lastHitter === who) return false;
  const incoming = b.vy * s > 0;
  // 球還沒過來：先停在引拍姿勢等球（提早按也打得到）
  if (b.y * s <= 0 || (b.isServe && b.bounces === 0)) return incoming && !force ? 'wait' : false;
  const dx = b.x - p.x, dyr = (b.y - (p.y - 0.4 * s)) * s;
  if (dyr < -0.25 && incoming && !force) return 'wait';
  if (Math.abs(dx) > 2.5 || Math.abs(dyr) > 2.1 || b.z > 3.5) return false;
  p.bh = dx * racketSide(who) < -0.15;
  const e = -dyr;               // >0 太早；<0 太晚
  const q = Math.max(0, 1 - Math.abs(e) / 2.6 - p.hold * 0.45);
  const inp = inputOf(who), aim = aimOf(inp);
  let ax, depth, spd, minClear;
  if (p.sType === 'lob') { ax = aim * 2.6 - e * 1.5; depth = 10; spd = 11; minClear = 2.6; }
  else {
    ax = aim * 3.1 - e * 2.0; depth = 9.4 + randn() * 0.4;
    spd = (18 + (inp.dy < -0.5 ? 4 : 0)) * (0.8 + 0.28 * q); minClear = 0.15;
  }
  ax += randn() * (1 - q) * 1.4; depth += randn() * (1 - q) * 1.2;
  const tx = ax * s, ty = -depth * s;
  const netErr = q < 0.2 && Math.random() < 0.35;
  launch(tx, ty, Math.hypot(tx - b.x, ty - b.y) / spd, netErr, minClear);
  b.lastHitter = who; b.isServe = false;
  A.plan = null; A.react = D.react;
  if (q > 0.85) pop('完美！', who); else if (q < 0.3) pop(e > 0 ? '太早了' : '太晚了', who);
  return true;
}

function aiHit() {
  const b = ball;
  A.swing = 0.4; A.hitDone = true; A.sType = 'drive'; A.bh = (b.x - A.x) * racketSide('A') < -0.15;
  let tx, ty = rand(8.6, 10.6), spd = D.spd * rand(0.9, 1.12), minClear = 0.15;
  if (Math.random() < 0.6) tx = (P.x > 0 ? -1 : 1) * rand(1.6, 3.4); else tx = rand(-3.2, 3.2);
  if (P.y < 7 && Math.random() < 0.6) { ty = rand(9.5, 10.8); spd = 11; minClear = 2.6; } // 你上網就吊高球
  let netErr = false;
  if (Math.random() < D.err) {
    const k = Math.random();
    if (k < 0.4) netErr = true;
    else if (k < 0.7) ty = rand(12.5, 14);
    else tx = (Math.random() < 0.5 ? -1 : 1) * rand(4.4, 5.4);
  }
  launch(tx, ty, Math.hypot(tx - b.x, ty - b.y) / spd, netErr, minClear);
  b.lastHitter = 'A'; b.isServe = false;
  A.plan = null;
}

// ====== 更新 ======
function moveToward(p, tx, ty, sp, dt) {
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  if (d < 0.02) return;
  const m = Math.min(d, sp * dt);
  p.x += dx / d * m; p.y += dy / d * m;
}
// 依玩家自己視角的輸入移動（A 的視角是翻轉的）
function movePlayer(who, inp, dt) {
  const p = obj(who), s = sideOf(who);
  const dx = inp.dx * s, dy = inp.dy * s, m = Math.hypot(dx, dy);
  if (phase === 'serve' && curServer === who) {
    if (!ball.tossed) {
      p.x += dx * 4 * dt;
      const side = s * (deuceCourt() ? 1 : -1);
      p.x = side > 0 ? clamp(p.x, 0.3, HW - 0.3) : clamp(p.x, -HW + 0.3, -0.3);
    }
  } else if (m > 0.05) {
    const k = Math.min(1, m) / m * 7.2 * dt;
    p.x = clamp(p.x + dx * k, -6.6, 6.6);
    p.y = s > 0 ? clamp(p.y + dy * k, 1.4, 14.6) : clamp(p.y + dy * k, -14.6, -1.4);
  }
  // 輔助補位：球朝你飛來、你沒按左右時，自動往擊球點靠（讓球落在正拍那側）
  if (phase === 'rally' && ball.lastHitter && ball.lastHitter !== who && ball.vy * s > 0.5 && Math.abs(inp.dx) < 0.3) {
    const tx = contactX(who) - racketSide(who) * 0.6, d = tx - p.x;
    if (Math.abs(d) > 0.12 && Math.abs(d) < 5) p.x = clamp(p.x + Math.sign(d) * Math.min(Math.abs(d), 3.4 * dt), -6.6, 6.6);

}
const SWING_T = 0.36, HOLD_MAX = 0.7;
function updateSwing(who, dt) {
  const p = obj(who);
  if (p.swing <= 0) return;
  if (!p.hitDone && p.swing >= 0.18) {
    const r = tryHit(who, p.hold >= HOLD_MAX);
    if (r === true) { p.hitDone = true; p.swing = Math.max(p.swing, 0.4); }
    else if (r === 'wait' && p.hold < HOLD_MAX) { p.hold += dt; p.bh = isBackhand(who); return; } // 停在引拍等球
    else if (p.swing >= 0.75) p.hitDone = true;
  }
  p.swing += dt / SWING_T;
  if (p.swing >= 1) p.swing = 0;
}

function updateAI(dt) {
  let tx = clamp(ball.x * 0.3, -2, 2), ty = -12.6;
  if (phase === 'serve') {
    tx = A.x; ty = A.y;
    if (curServer === 'A') {
      aiServeTimer -= dt;
      if (aiServeTimer <= 0 && !ball.tossed) toss();
      if (ball.tossed && ball.vz < 0.25 && ball.z > 1.6) serveShot('A', rand(D.sq[0], D.sq[1]), [-1, 0, 1][Math.floor(Math.random() * 3)]);
    }
  } else if (phase === 'rally' && ball.lastHitter === 'P') {
    if (A.react > 0) { A.react -= dt; tx = A.x; ty = A.y; }
    else {
      if (!A.plan) A.plan = predict() || { out: true };
      if (!A.plan.out) { tx = A.plan.x + 0.45; ty = clamp(A.plan.y - 0.4, -15.5, -1.5); }
    }
    const b = ball;
    if (b.y < 0 && b.bounces === 1 && b.z < 2.6 && Math.abs(b.x - A.x) < 1.4 && Math.abs(b.y - (A.y + 0.4)) < 0.75 && !(A.plan && A.plan.out)) aiHit();
  }
  moveToward(A, tx, ty, D.move, dt);
  A.y = clamp(A.y, -15.5, -1.5); A.x = clamp(A.x, -6.8, 6.8);
}

function update(dt) {
  movePlayer('P', localInput(), dt);
  updateSwing('P', dt);
  if (net) { movePlayer('A', remoteIn, dt); updateSwing('A', dt); }
  else { updateAI(dt); if (A.swing > 0) { A.swing += dt / SWING_T; if (A.swing >= 1) A.swing = 0; } }

  // 球
  const sub = 3;
  for (let i = 0; i < sub; i++) stepBall(dt / sub);
  if (!ball.held) { ball.trail.push([ball.x, ball.y, ball.z]); if (ball.trail.length > 8) ball.trail.shift(); }
  else ball.trail.length = 0;

  // 死球計時
  if (phase === 'dead') {
    deadTimer -= dt;
    if (deadTimer <= 0) {
      if (matchOver) { mode = 'over'; showOver(); }
      else setupServe();
    }
  }
}

function showOver() {
  const win = matchOver === me();
  $('result').textContent = win ? '🏆 你贏了！' : (net ? '對手獲勝，再接再厲！' : '電腦獲勝，再接再厲！');

    ell(bx + o * 1.15 * s, Y(0.03 + lift[i]), 0.12 * s, 0.03 * s, L.frame);
  });
  // 短褲
  ctx.fillStyle = L.shorts; ctx.beginPath(); ctx.roundRect(bx - 0.25 * s, Y(0.6), 0.5 * s, 0.22 * s, 0.06 * s); ctx.fill();
  // 另一隻手
  const sh2 = [bx - 0.23 * s * hand, Y(0.92)];
  const swingT = p.swing > 0 ? p.swing : 0;
  const oh = [bx - (0.33 + 0.08 * Math.sin(swingT * Math.PI)) * s * hand, Y(0.68 + (joy ? 0.6 : 0))];
  ctx.strokeStyle = L.skin; ctx.lineWidth = 0.1 * s; ctx.beginPath(); ctx.moveTo(sh2[0], sh2[1]); ctx.lineTo(oh[0], oh[1]); ctx.stroke();
  circle(oh[0], oh[1], 0.07 * s, L.skin);
  // 身體
  ctx.fillStyle = L.shirt; ctx.beginPath(); ctx.roundRect(bx - 0.27 * s, Y(1.04), 0.54 * s, 0.48 * s, 0.14 * s); ctx.fill();
  ctx.fillStyle = L.trim; ctx.fillRect(bx - 0.27 * s, Y(0.66), 0.54 * s, 0.05 * s);
  if (!near) { ctx.fillStyle = L.trim; ctx.beginPath(); ctx.moveTo(bx - 0.1 * s, Y(1.04)); ctx.lineTo(bx, Y(0.94)); ctx.lineTo(bx + 0.1 * s, Y(1.04)); ctx.fill(); }
  else { ctx.fillStyle = L.trim; ctx.font = `800 ${0.22 * s}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(who === 'P' ? '1' : '2', bx, Y(0.84)); }
  // 頭
  const blink = (t + (who === 'P' ? 0 : 1.7)) % 3.6 < 0.12;
  const lookX = clamp(((FLIP ? -ball.x : ball.x) - (FLIP ? -p.x : p.x)) / 3, -1, 1);
  drawHead(bx, Y(1.42), 0.38 * s, L, !near, joy ? 'joy' : blink ? 'blink' : 'normal', hand, lookX);
  // 拿拍的手與球拍（球拍一律在身體前、擊球那一側，不會甩到頭後面）
  const bh = p.bh && p.swing > 0 && p.sType !== 'serve', m = bh ? -1 : 1;
  const sh = [bx + 0.23 * s * hand * (bh ? -0.25 : 1), Y(0.94)];
  const ang = racketAng(p, who);
  const dir = [Math.sin(ang) * hand * m, -Math.cos(ang)];
  const hx = sh[0] + dir[0] * 0.3 * s, hy = sh[1] + dir[1] * 0.3 * s;
  ctx.strokeStyle = L.skin; ctx.lineWidth = 0.1 * s; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.lineTo(hx, hy); ctx.stroke();
  if (bh) { ctx.beginPath(); ctx.moveTo(bx - 0.2 * s * hand, Y(0.92)); ctx.lineTo(hx, hy); ctx.stroke(); } // 雙手反拍
  const rx = hx + dir[0] * 0.26 * s, ry = hy + dir[1] * 0.26 * s;
  ctx.strokeStyle = '#333'; ctx.lineWidth = 0.05 * s; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(rx, ry); ctx.stroke();
  const cx = rx + dir[0] * 0.2 * s, cy = ry + dir[1] * 0.2 * s, rot = Math.atan2(dir[1], dir[0]) + Math.PI / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.beginPath(); ctx.ellipse(0, 0, 0.15 * s, 0.2 * s, 0, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
  ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(0.5, 0.012 * s);
  for (let k = -3; k <= 3; k++) { ctx.beginPath(); ctx.moveTo(k * 0.04 * s, -0.2 * s); ctx.lineTo(k * 0.04 * s, 0.2 * s); ctx.moveTo(-0.15 * s, k * 0.05 * s); ctx.lineTo(0.15 * s, k * 0.05 * s); ctx.stroke(); }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 0, 0.15 * s, 0.2 * s, 0, 0, TAU); ctx.strokeStyle = L.frame; ctx.lineWidth = 0.045 * s; ctx.stroke();
  ctx.restore();

}
function drawUmpire() {
  const x = -7.0, y = 0;
  const t = performance.now() / 1000;
  ctx.strokeStyle = '#d9d9d9'; ctx.lineCap = 'round';
  for (const [dx, dy] of [[-0.35, -0.35], [0.35, -0.35], [-0.35, 0.35], [0.35, 0.35]]) {
    const a = P3v(x + dx, y + dy, 0), b = P3v(x + dx * 0.6, y + dy * 0.6, 1.7);
    ctx.lineWidth = Math.max(1.5, a[2] * 0.06); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  for (const z of [0.6, 1.15]) { const a = P3v(x - 0.3, y + 0.32, z), b = P3v(x + 0.3, y + 0.32, z); ctx.lineWidth = Math.max(1, a[2] * 0.04); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  quad([[x - 0.4, y - 0.4, 1.7], [x + 0.4, y - 0.4, 1.7], [x + 0.4, y + 0.4, 1.7], [x - 0.4, y + 0.4, 1.7]], '#2a9d8f', true);
  const [bx, by, s] = P3v(x, y, 1.7);
  const L = LOOK.U;
  ctx.fillStyle = L.shirt; ctx.beginPath(); ctx.roundRect(bx - 0.25 * s, by - 0.55 * s, 0.5 * s, 0.5 * s, 0.13 * s); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(bx - 0.08 * s, by - 0.55 * s); ctx.lineTo(bx, by - 0.45 * s); ctx.lineTo(bx + 0.08 * s, by - 0.55 * s); ctx.fill();
  const bob = Math.sin(t * 1.5) * 0.02 * s;
  drawHead(bx, by - 0.9 * s + bob, 0.33 * s, L, true, (t % 4.3) < 0.12 ? 'blink' : (cheer > 0 ? 'joy' : 'normal'), 1, clamp(((FLIP ? -ball.x : ball.x) - x) / 4, -1, 1));
}
function drawBall() {
  const b = ball;
  drawShadow(b.x, b.y, 0.1, 0.045, clamp(0.5 - b.z * 0.06, 0.25, 0.5));
  if (!b.held && b.z > 1.2) { // 球到影子的垂直虛線，看得出高度
    const a = P3(b.x, b.y, 0), c = P3(b.x, b.y, b.z);
    ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(233,255,79,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); ctx.stroke(); ctx.restore();
  }
  b.trail.forEach(([x, y, z], i) => {
    const p = P3(x, y, z); circle(p[0], p[1], Math.max(1.5, 0.08 * p[2]) * (i / b.trail.length), `rgba(233,255,79,${0.07 * i})`);
  });
  const p = P3(b.x, b.y, b.z), r = Math.max(3, 0.1 * p[2]);
  circle(p[0], p[1], r, '#e9ff4f');
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(0.7, r * 0.18);
  ctx.beginPath(); ctx.arc(p[0] - r * 0.9, p[1], r * 0.8, -0.9, 0.9); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.stroke();
}
// 高吊球落點：地上的圈會隨球接近而縮小，圈縮到最小時球就落地
function drawLandMark() {
  const mk = ball.mark;
  if (!mk || ball.held || mode !== 'play') return;
  const [lx, ly, sx, sy] = mk;
  const tot = Math.hypot(lx - sx, ly - sy) || 1, rem = clamp(Math.hypot(lx - ball.x, ly - ball.y) / tot, 0, 1);
  const ringPath = r => {
    ctx.beginPath();
    for (let i = 0; i <= 28; i++) { const a = i / 28 * TAU, p = P3(lx + Math.cos(a) * r, ly + Math.sin(a) * r, 0); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  };
  ringPath(0.32); ctx.fillStyle = 'rgba(233,255,79,.28)'; ctx.fill();
  ctx.strokeStyle = 'rgba(233,255,79,.9)'; ctx.lineWidth = 2; ctx.stroke();
  ringPath(0.32 + rem * 1.6); ctx.strokeStyle = `rgba(255,255,255,${0.35 + 0.5 * (1 - rem)})`; ctx.lineWidth = 2; ctx.stroke();
  const c = P3(lx, ly, 0);
  ctx.strokeStyle = 'rgba(233,255,79,.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(c[0] - 0.18 * c[2], c[1]); ctx.lineTo(c[0] + 0.18 * c[2], c[1]); ctx.moveTo(c[0], c[1] - 0.08 * c[2]); ctx.lineTo(c[0], c[1] + 0.08 * c[2]); ctx.stroke();
}
function drawHUD() {
  if (!sc || mode === 'menu') return;
  const x = 10, y = 10, w = 200, rh = 26;
  ctx.fillStyle = 'rgba(8,16,24,.82)'; ctx.beginPath(); ctx.roundRect(x, y, w, rh * 2 + 12, 10); ctx.fill();
  const row = (who, yy) => {
    ctx.fillStyle = who === 'P' ? '#ff6b5e' : '#ffd23f'; ctx.fillRect(x + 8, yy - 8, 4, 16);
    ctx.fillStyle = '#fff'; ctx.font = '600 15px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(NAMES[who], x + 18, yy);
    if (curServer === who && mode === 'play') { ctx.beginPath(); ctx.arc(x + 70, yy, 4, 0, Math.PI * 2); ctx.fillStyle = '#e9ff4f'; ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(sc.games[who], x + 120, yy);
    let pt;
    const a = sc.pts[who], b = sc.pts[opp(who)];
    if (sc.tb) pt = String(a);
    else if (a >= 3 && b >= 3) pt = a > b ? 'AD' : '40';
    else pt = PT[Math.min(a, 3)];
    ctx.fillStyle = 'rgba(233,255,79,.15)'; ctx.fillRect(x + 145, yy - 11, 46, 22);
    ctx.fillStyle = '#e9ff4f'; ctx.fillText(pt, x + 168, yy);
  };
  row(opp(me()), y + 6 + rh / 2); row(me(), y + 6 + rh * 1.5);
  ctx.font = '11px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.textAlign = 'left';
  ctx.fillText(sc.tb ? '搶七' : `搶 ${target} 局`, x + 4, y + rh * 2 + 24);
  if (mode === 'play' && phase === 'serve') {
    ctx.textAlign = 'center'; ctx.font = '600 15px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.9)';
    const t = curServer === me()
      ? (ball.tossed ? '球在最高點時再按一次！' : (isTouch ? '按「擊球」拋球發球' : '按空白鍵拋球發球') + (serveTry === 2 ? '（第二發）' : ''))
      : `${NAMES[curServer]}發球中…`;

}
function drawMsg(dt) {
  if (msg.t > 0) {
    msg.t -= dt;
    const a = Math.min(1, msg.t * 3);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const cy = H * 0.42, main = fmt(msg.main), sub = fmt(msg.sub);
    ctx.font = `800 ${Math.min(46, W / 10)}px system-ui,sans-serif`;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(main, W / 2, cy);
    ctx.fillStyle = '#fff'; ctx.fillText(main, W / 2, cy);

    ctx.globalAlpha = Math.min(1, p.t * 2); ctx.font = '700 16px system-ui,sans-serif'; ctx.textAlign = 'center';

function render(dt) {
  const t = performance.now() / 1000;

  g.addColorStop(0, '#0d1b3a'); g.addColorStop(1, '#2b4a7a');

  drawStands(t);
  drawGround();
  drawBoards();

  const k = FLIP ? -1 : 1;
  const items = [[A.y * k, () => drawPlayer(A, 'A')], [0, drawNet], [0, drawUmpire], [P.y * k, () => drawPlayer(P, 'P')], [ball.y * k, drawBall]];
  items.sort((a, b) => a[0] - b[0]).forEach(i => i[1]());

// 主選單背景：自動對打的展示
function demo() {
  const t = performance.now() / 1000;
  P.x = Math.sin(t * 0.7) * 2; A.x = Math.sin(t * 0.9 + 1) * 2;
  P.y = 12.5; A.y = -12.5; P.swing = A.swing = 0;
  ball.held = false; ball.x = Math.sin(t * 0.6) * 2.5;
  const ph = (t % 2.4) / 2.4; ball.y = -11.5 + 23 * (ph < 0.5 ? ph * 2 : 2 - ph * 2);
  ball.z = 0.9 + Math.abs(Math.sin(ph * Math.PI * 2)) * 1.6; ball.trail = [];
}

let last = performance.now(), sendAcc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (isGuest()) { if (net.conn) guestSendInput(now); }
  else if (mode === 'play' && !paused) update(dt * TS);
  else if (mode === 'menu') demo();
  if (isHost() && net.conn.open) {
    sendAcc += dt;
    if (sendAcc >= 1 / 60 - 0.002) { sendAcc = 0; try { net.conn.send(snapshot()); } catch (e) {} }
  }
  if (!paused) {
    cheer = Math.max(0, cheer - dt);
    for (const p of [P, A]) {
      const d = Math.hypot(p.x - (p.lx ?? p.x), p.y - (p.ly ?? p.y));
      const v = dt > 0 && d < 2 ? d / dt : 0;
      p.run += (Math.min(1, v / 4) - p.run) * Math.min(1, dt * 10);
      if (d < 2) p.wp += d * 4.5;

requestAnimationFrame(loop);
